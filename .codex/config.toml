# Safe interactive defaults: sandbox writes stay inside the workspace and
# approvals ask before acting. Network stays off unless a task enables it.
sandbox_mode = "workspace-write"
approval_policy = "on-request"

# Tier 1 - no keys required, same servers as the AGENTS.md fallback ladder.
